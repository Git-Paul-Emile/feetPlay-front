<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeetiPlay — Hors ligne</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #CDFF71;
      --dark:   #000441;
      --red:    #de0035;
      --gold:   #fcc434;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      padding: 2rem 1.5rem;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* ─── Glowing orbs in background ─── */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 450px; height: 450px;
      background: radial-gradient(circle, rgba(205,255,113,.18) 0%, transparent 70%);
      top: -120px; left: -120px;
      animation: drift1 9s ease-in-out infinite alternate;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,4,65,.5) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      animation: drift2 11s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(70px, 50px); } }
    @keyframes drift2 { to { transform: translate(-60px, -40px); } }

    /* ─── Content wrapper ─── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(205,255,113,.1),
        0 32px 64px rgba(0,0,0,.6);
    }

    /* ─── Icon ─── */
    .icon-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 1.75rem;
    }
    .icon-bg {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--green), #8cc200);
      opacity: .12;
      animation: pulse 2.5s ease-in-out infinite;
    }
    .icon-inner {
      position: absolute;
      inset: 8px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1a2200, #2a3a00);
      border: 1px solid rgba(205,255,113,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: .12; }
      50%       { transform: scale(1.2); opacity: .25; }
    }

    /* ─── Wifi off badge ─── */
    .wifi-badge {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #121212;
      border: 2px solid rgba(255,255,255,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
    }

    /* ─── Title ─── */
    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2;
      color: #fff;
      margin-bottom: .6rem;
    }
    h1 span {
      color: var(--green);
    }

    /* ─── Description ─── */
    .desc {
      font-size: .95rem;
      line-height: 1.65;
      color: rgba(255,255,255,.5);
      margin-bottom: 2rem;
    }

    /* ─── Chips ─── */
    .chips {
      display: flex;
      gap: .6rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 99px;
      padding: .35rem .85rem;
      font-size: .78rem;
      color: rgba(255,255,255,.65);
      white-space: nowrap;
    }
    .chip-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ─── Retry button ─── */
    .btn-retry {
      width: 100%;
      padding: .9rem 1.5rem;
      border-radius: 14px;
      border: none;
      background: var(--green);
      color: #080808;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .01em;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
      box-shadow: 0 8px 24px rgba(205,255,113,.25);
    }
    .btn-retry:hover  { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(205,255,113,.4); }
    .btn-retry:active { transform: translateY(0);    opacity: .9; }
    .btn-retry.loading { opacity: .6; pointer-events: none; }

    /* ─── Status bar ─── */
    .status-bar {
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      min-height: 20px;
      font-size: .8rem;
      color: rgba(255,255,255,.35);
      transition: color .3s;
    }
    .status-bar.online   { color: var(--green); }
    .status-bar.error    { color: var(--red); }
    .status-bar.checking { color: var(--gold); }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }
    .status-dot.spin {
      animation: blink .7s ease-in-out infinite alternate;
    }
    @keyframes blink { to { opacity: .2; } }

    /* ─── Footer ─── */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: 2rem;
      font-size: .75rem;
      color: rgba(255,255,255,.18);
    }
    .footer strong { color: rgba(255,255,255,.35); }
  </style>
</head>
<body>

  <div class="card">

    <!-- Icon -->
    <div class="icon-wrap">
      <div class="icon-bg"></div>
      <div class="icon-inner">🎬</div>
      <div class="wifi-badge">📵</div>
    </div>

    <!-- Title -->
    <h1>You're<br /><span>offline</span></h1>

    <!-- Description -->
    <p class="desc">
      Check your internet connection and try again.<br />
      Your tickets and recent events are still available.
    </p>

    <!-- Info chips -->
    <div class="chips">
      <span class="chip">
        <span class="chip-dot" style="background:#CDFF71"></span>
        Tickets cached
      </span>
      <span class="chip">
        <span class="chip-dot" style="background:#fcc434"></span>
        Recent events
      </span>
      <span class="chip">
        <span class="chip-dot" style="background:#de0035"></span>
        Offline mode
      </span>
    </div>

    <!-- Retry -->
    <button class="btn-retry" id="retryBtn" onclick="retry()">
      Retry connection
    </button>

    <!-- Status -->
    <div class="status-bar" id="statusBar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText"></span>
    </div>

  </div>

  <p class="footer">
    <strong>FeetiPlay</strong> — Streaming &amp; Live Ticketing
  </p>

  <script>
    const btn = document.getElementById('retryBtn');
    const bar = document.getElementById('statusBar');
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');

    function setStatus(state, message) {
      bar.className = 'status-bar ' + state;
      dot.className = 'status-dot' + (state === 'checking' ? ' spin' : '');
      txt.textContent = message;
    }

    function retry() {
      btn.classList.add('loading');
      btn.textContent = 'Checking…';
      setStatus('checking', 'Testing connection…');

      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          setStatus('online', 'Connection restored!');
          setTimeout(() => { window.location.href = '/'; }, 600);
        })
        .catch(() => {
          setStatus('error', 'Still offline. Try again in a moment.');
          btn.classList.remove('loading');
          btn.textContent = 'Retry connection';
        });
    }

    window.addEventListener('online', () => {
      setStatus('online', 'Connection restored, redirecting…');
      setTimeout(() => { window.location.href = '/'; }, 800);
    });

    window.addEventListener('offline', () => {
      setStatus('error', 'Connection lost.');
    });
  </script>
</body>
</html>
